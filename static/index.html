<body>
    <h1>我的待办事项</h1>
    <form id="add-todo-form">
        <p>
            <label for="todo-content">待办内容：</label>
            <input id="todo-content" type="text" required>
        </p>

        <p>
            <label for="todo-deadline">截止日期：</label>
            <input id="todo-deadline" type="date" required>
        </p>

        <button id="add-button" type="submit">添加待办</button>
    </form>

    <p id="add-message"></p>

    <label for="status-filter">状态：</label>
    <select id="status-filter">
        <option value="">全部</option>
        <option value="未完成">未完成</option>
        <option value="已完成">已完成</option>
    </select>
    <button id="refresh-button" type="button">刷新待办</button>
    <p id="message">正在加载……</p>
    <ul id="todo-list"></ul>

    <script>
        const refreshButton = document.getElementById("refresh-button");
        const statusFilter = document.getElementById("status-filter");
        const addForm = document.getElementById("add-todo-form");
        const contentInput = document.getElementById("todo-content");
        const deadlineInput = document.getElementById("todo-deadline");
        const addMessage = document.getElementById("add-message");
        const addButton = document.getElementById("add-button");
        async function loadTodos() {
            const message = document.getElementById("message");
            const list = document.getElementById("todo-list");

            refreshButton.disabled = true;
            statusFilter.disabled = true; 
            message.textContent = "正在加载……";

            try {
                const status = statusFilter.value;
                let url = "/todos";

                if (status !== "") {
                    url = `/todos?status=${encodeURIComponent(status)}`;
                }

                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error("获取待办失败");
                }

                const todos = await response.json();

                list.replaceChildren();

                for (const todo of todos) {
                    const item = document.createElement("li");
                    item.textContent =
                        `${todo.content}｜${todo.status}｜截止日期：${todo.deadline}`;

                    if (todo.status === "未完成") {
                        const completeButton = document.createElement("button");
                        completeButton.type = "button";
                        completeButton.textContent = "标记完成";
                        completeButton.addEventListener("click", async function () {
                            if (completeButton.disabled) {
                                return;
                            }

                            completeButton.disabled = true;
                            completeButton.textContent = "正在完成……";

                            try {
                                const response = await fetch(
                                    `/todos/${todo.id}/complete`,
                                    {
                                        method: "POST"
                                    }
                                );

                                const result = await response.json();

                                if (!response.ok) {
                                    const errorMessage =
                                        typeof result.detail === "string"
                                            ? result.detail
                                            : "无法完成该待办";

                                    throw new Error(errorMessage);
                                }

                                await loadTodos();
                            } catch (error) {
                                message.textContent = `标记完成失败：${error.message}`;
                                console.error(error);
                            } finally {
                                completeButton.disabled = false;
                                completeButton.textContent = "标记完成";
                            }
                        });
                        item.appendChild(completeButton);
                    }

                    list.appendChild(item);
                }

                message.textContent =
                    todos.length === 0 ? "暂无待办事项" : `共 ${todos.length} 条待办`;
            } catch (error) {
                message.textContent = "加载失败，请检查服务是否正常运行。";
                console.error(error);
                list.replaceChildren();
            } finally {
                refreshButton.disabled = false;
                statusFilter.disabled = false;
            }
        }

        refreshButton.addEventListener("click", loadTodos);
        statusFilter.addEventListener("change", loadTodos);
        addForm.addEventListener("submit", async function (event) {
            event.preventDefault();

            if (addButton.disabled) {
                return;
            }

            const content = contentInput.value;
            const deadline = deadlineInput.value;

            addButton.disabled = true;
            addMessage.textContent = "正在添加……";

            try {
                const response = await fetch("/todos", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        content: content,
                        deadline: deadline
                    })
                });

                const result = await response.json();

                if (!response.ok) {
                    const errorMessage =
                        typeof result.detail === "string"
                            ? result.detail
                            : "添加失败，请检查输入内容";

                    throw new Error(errorMessage);
                }

                addMessage.textContent = `添加成功：${result.content}`;
                addForm.reset();

                await loadTodos();
            } catch (error) {
                addMessage.textContent = `添加失败：${error.message}`;
                console.error(error);
            } finally {
                addButton.disabled = false;
            }
        });


        loadTodos();
    </script>
</body>
